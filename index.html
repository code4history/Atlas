<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas Demos</title>
  <link rel="stylesheet" href="./demo/demo-shell.css">
</head>
<body class="c4h-portal">
  <header class="c4h-portal-header">
    <h1>@c4h/atlas - デモ一覧</h1>
    <p>Atlas の candidate CRS lookup を確認するデモ</p>
  </header>

  <main class="c4h-portal-main">
    <div class="c4h-demo-grid">
      <a class="c4h-demo-card" href="./demo/crs-candidate-lookup.html">
        <div class="c4h-card-header">
          <div class="c4h-badge">Demo - CRS Candidate Lookup</div>
          <h2>Atlas CRS Demo</h2>
        </div>
        <div class="c4h-card-body">
          地理 board 上に複数点を打ち、bbox から candidate CRS を検索します。
          候補一覧、選択 CRS の bbox overlay、projection text / WKT detail を確認できます。
        </div>
        <div class="c4h-card-footer">-&gt; demo/crs-candidate-lookup.html</div>
      </a>
    </div>
  </main>

  <footer class="c4h-portal-footer">@c4h/atlas - Atlas Demo Portal</footer>
</body>
</html>
